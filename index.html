<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1230">
<title>Ледяной бег</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: slim header above a framed night-scene stage; HUD over the canvas, thumb pads in the bottom corners, overlays for menu and game over. Single dark look by choice (a night scene). */
:root {
  --night: #0a1230;
  --night-2: #16275a;
  --snow: #eaf2ff;
  --ice: #9fd8ff;
  --ice-deep: #4f9ad6;
  --hat: #ff4d5e;
  --hat-deep: #b8283a;
  --gold: #ffd166;
  --muted: #a9bfeb;
  --font-display: "Comfortaa", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
body {
  box-sizing: border-box;
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--snow);
  font-family: var(--font-body);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font: 700 20px/1 var(--font-display); letter-spacing: 0.01em; }
.best { font-size: 14px; font-weight: 600; color: var(--muted); }
.best b { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 800; }

.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: 18px;
  overflow: hidden;
  background: var(--night-2);
  box-shadow: 0 0 0 1px rgba(159, 216, 255, 0.28), 0 12px 32px rgba(0, 0, 0, 0.45);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute; top: 46px; left: 14px; right: 14px;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; z-index: 2;
  text-shadow: 0 2px 8px rgba(5, 10, 35, 0.8);
}
.stat { display: grid; gap: 2px; }
.stat.right { text-align: right; }
.stat span { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; color: #fff; }

.controls {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; justify-content: space-between; align-items: flex-end;
  pointer-events: none; z-index: 3;
}
.pad {
  pointer-events: auto;
  width: 96px; height: 96px; border-radius: 50%;
  border: 2px solid rgba(234, 242, 255, 0.55);
  background: rgba(234, 242, 255, 0.14);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  color: var(--snow);
  font: 700 14px/1.1 var(--font-display);
  display: grid; place-content: center; justify-items: center; gap: 4px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  cursor: pointer;
}
.pad.jump { width: 108px; height: 108px; }
.pad i { font-style: normal; font-size: 26px; line-height: 1; }
.pad.on { background: rgba(159, 216, 255, 0.4); border-color: #fff; transform: scale(0.96); }

.overlay {
  position: absolute; inset: 0; z-index: 5;
  display: grid; place-items: center; padding: 20px;
  background: linear-gradient(180deg, rgba(7, 13, 38, 0.25), rgba(7, 13, 38, 0.78));
}
.card { max-width: 340px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.card h1 {
  margin: 0; font: 700 clamp(34px, 10vw, 48px)/1.05 var(--font-display); color: #fff; text-wrap: balance;
  text-shadow: 0 2px 0 rgba(79, 154, 214, 0.7), 0 0 26px rgba(159, 216, 255, 0.55);
}
.card p { margin: 0; color: #d4e2ff; font-weight: 600; font-size: 15px; line-height: 1.45; text-wrap: pretty; }
.card .hint { font-size: 13px; color: var(--muted); }
kbd {
  font: 800 12px var(--font-body); padding: 2px 7px; border-radius: 6px;
  background: rgba(234, 242, 255, 0.14); border: 1px solid rgba(234, 242, 255, 0.35); color: var(--snow);
}
.go {
  appearance: none; border: 0; cursor: pointer; padding: 14px 38px; border-radius: 999px;
  font: 700 19px var(--font-display); color: #fff; background: var(--hat);
  box-shadow: 0 4px 0 var(--hat-deep), 0 10px 22px rgba(255, 77, 94, 0.35);
}
.go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--hat-deep), 0 6px 16px rgba(255, 77, 94, 0.3); }
.go:focus-visible, .pad:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 22px; }
.stats div { display: grid; gap: 3px; }
.stats span { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stats b { font: 700 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.badge { padding: 4px 12px; border-radius: 999px; background: var(--gold); color: #3a2a00; font-weight: 800; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .pad, .go { transition: none; } }

[hidden] { display: none !important; }
/* ---- v2: menu, levels, editor ---- */
.overlay { display: flex; overflow-y: auto; }
.overlay > * { margin: auto; }
.menu { background: linear-gradient(180deg, rgba(7, 13, 38, 0.3), rgba(7, 13, 38, 0.88)); }
.garland { position: absolute; top: 0; left: 0; right: 0; height: 90px; display: flex; justify-content: space-around; pointer-events: none; z-index: 1; }
.orn { width: 2px; height: var(--h); background: rgba(234, 242, 255, 0.5); position: relative; transform-origin: top center; animation: swing 3.4s ease-in-out infinite; }
.orn::after {
  content: ""; position: absolute; left: 50%; bottom: -16px; width: 20px; height: 20px; border-radius: 50%; transform: translateX(-50%);
  background: var(--c); box-shadow: 0 0 14px var(--c), inset -3px -3px 0 rgba(0, 0, 0, 0.18), inset 3px 3px 0 rgba(255, 255, 255, 0.35);
}
@keyframes swing { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@media (prefers-reduced-motion: reduce) { .orn { animation: none; } }
.menu-card { display: grid; gap: 12px; justify-items: center; text-align: center; width: min(100%, 360px); padding-top: 52px; padding-bottom: 6px; }
.menu-card h1 {
  margin: 0; font: 700 clamp(36px, 11vw, 52px)/1.04 var(--font-display); color: #fff; text-wrap: balance;
  text-shadow: 0 2px 0 rgba(79, 154, 214, 0.7), 0 0 28px rgba(159, 216, 255, 0.6);
}
.sub { margin: 0; color: var(--gold); font-weight: 800; letter-spacing: 0.04em; font-size: 14px; }
.diffs { display: grid; gap: 8px; width: 100%; }
.diff {
  appearance: none; text-align: left; cursor: pointer; font: inherit; color: var(--snow);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px;
  padding: 10px 14px; border-radius: 14px; border: 2px solid rgba(234, 242, 255, 0.2); background: rgba(10, 18, 48, 0.6);
}
.diff b { font: 700 16px var(--font-display); }
.diff span { grid-column: 1; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.diff .stars { grid-column: 2; grid-row: 1 / span 2; color: var(--dc); letter-spacing: 2px; font-size: 15px; }
.diff .stars s { opacity: 0.25; text-decoration: none; }
.diff[aria-pressed="true"] { border-color: var(--dc); background: rgba(34, 52, 110, 0.8); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
.diff:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.go2 { appearance: none; border: 0; cursor: pointer; padding: 12px 10px; border-radius: 14px; font: 700 15px var(--font-display); color: #fff; }
.go2:active { transform: translateY(2px); }
.go2:focus-visible, .sm:focus-visible, .tool:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.go2.green { background: #2fb386; box-shadow: 0 3px 0 #1c7d5c; }
.go2.ice { background: #4f9ad6; box-shadow: 0 3px 0 #2f6aa0; }
.go2.plain { background: rgba(234, 242, 255, 0.18); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
.menu-card .hint { margin: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.lvl-card { width: min(100%, 400px); display: grid; gap: 12px; text-align: center; }
.lvl-card h1 { margin: 0; font: 700 32px/1.05 var(--font-display); color: #fff; text-shadow: 0 0 22px rgba(159, 216, 255, 0.5); }
#levelList { display: grid; gap: 8px; max-height: 46vh; overflow: auto; text-align: left; }
.lv { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(10, 18, 48, 0.65); border: 1px solid rgba(234, 242, 255, 0.2); }
.lv .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
.sm { appearance: none; border: 0; cursor: pointer; padding: 8px 11px; border-radius: 10px; font: 800 13px var(--font-body); background: rgba(234, 242, 255, 0.18); color: var(--snow); }
.sm.play { background: var(--hat); color: #fff; }
.sm.red { background: #c92f3d; color: #fff; }
.empty { color: var(--muted); padding: 14px; font-weight: 600; text-align: center; }
.editor { position: absolute; inset: 0; z-index: 4; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
.editor > * { pointer-events: auto; }
.ed-top { display: flex; gap: 8px; padding: 10px; align-items: center; background: linear-gradient(180deg, rgba(7, 13, 38, 0.85), rgba(7, 13, 38, 0)); }
.ed-top input { flex: 1; min-width: 0; border-radius: 10px; border: 1px solid rgba(234, 242, 255, 0.35); background: rgba(10, 18, 48, 0.75); color: var(--snow); padding: 8px 10px; font: 800 14px var(--font-body); }
.ed-bottom { background: linear-gradient(0deg, rgba(7, 13, 38, 0.94), rgba(7, 13, 38, 0)); padding: 18px 8px 10px; display: grid; gap: 8px; }
.ed-tools { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.ed-tools::-webkit-scrollbar { display: none; }
.tool { flex: 0 0 auto; appearance: none; border: 1px solid rgba(234, 242, 255, 0.3); cursor: pointer; padding: 9px 12px; border-radius: 10px; font: 800 13px var(--font-body); background: rgba(10, 18, 48, 0.75); color: var(--snow); }
.tool[aria-pressed="true"] { background: var(--gold); color: #3a2a00; border-color: var(--gold); }
.ed-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; color: var(--muted); font-weight: 800; font-size: 13px; }
.ed-nav .sm { padding: 8px 14px; }
.toast { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); max-width: 90%; text-align: center; padding: 8px 14px; border-radius: 999px; background: rgba(10, 18, 48, 0.94); border: 1px solid rgba(234, 242, 255, 0.35); font-weight: 800; font-size: 13px; z-index: 9; pointer-events: none; }
</style>

</head>
<body>
<header class="top">
  <div class="brand">Ледяной бег</div>
  <div class="best">Рекорд <b id="bestTop">0</b></div>
</header>

<main class="stage" id="stage">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="stat"><span id="scoreLbl">Очки</span><b id="score">0</b></div>
    <div class="stat right"><span>Подарки</span><b id="gifts">0</b></div>
  </div>

  <div class="controls" id="controls" hidden>
    <button class="pad" id="padRun" type="button" aria-label="Бежать"><i>»</i><span>Бежать</span></button>
    <button class="pad jump" id="padJump" type="button" aria-label="Прыжок"><i>↑</i><span>Прыжок</span></button>
  </div>

  <section class="overlay menu" id="menu">
    <div class="garland" aria-hidden="true">
      <div class="orn" style="--c:#ff4d5e;--h:34px"></div>
      <div class="orn" style="--c:#ffd166;--h:58px;animation-delay:-0.7s"></div>
      <div class="orn" style="--c:#6ee7ff;--h:28px;animation-delay:-1.4s"></div>
      <div class="orn" style="--c:#ff8fd8;--h:50px;animation-delay:-2.1s"></div>
      <div class="orn" style="--c:#8dff9e;--h:36px;animation-delay:-0.3s"></div>
      <div class="orn" style="--c:#ff4d5e;--h:62px;animation-delay:-1.8s"></div>
      <div class="orn" style="--c:#ffd166;--h:30px;animation-delay:-1s"></div>
    </div>
    <div class="menu-card">
      <h1>Ледяной бег</h1>
      <p class="sub">★ С Новым годом! ★</p>
      <div class="diffs" id="diffs">
        <button class="diff" type="button" data-diff="easy" style="--dc:#6ee7a8" aria-pressed="false"><b>Легко</b><span>Шипы и подарки. Площадки держатся дольше.</span><em class="stars" style="font-style:normal">★<s>★★★</s></em></button>
        <button class="diff" type="button" data-diff="mid" style="--dc:#6ee7ff" aria-pressed="true"><b>Не особо тяжело</b><span>Добавляются пружины, мигающие площадки и лифты.</span><em class="stars" style="font-style:normal">★★<s>★★</s></em></button>
        <button class="diff" type="button" data-diff="hard" style="--dc:#ffb703" aria-pressed="false"><b>Тяжело</b><span>Пилы-снежинки, снежные комы, шары для двойного прыжка.</span><em class="stars" style="font-style:normal">★★★<s>★</s></em></button>
        <button class="diff" type="button" data-diff="hell" style="--dc:#ff4d5e" aria-pressed="false"><b>Ад</b><span>Всё сразу, быстро и без пощады.</span><em class="stars" style="font-style:normal">★★★★</em></button>
      </div>
      <button class="go" id="btnStart" type="button">Играть</button>
      <div class="row2">
        <button class="go2 green" id="btnEdit" type="button">Редактор уровней</button>
        <button class="go2 ice" id="btnMine" type="button">Мои уровни</button>
      </div>
      <p class="hint">Держи «Бежать» и жми «Прыжок». На клавиатуре это <kbd>→</kbd> и <kbd>Пробел</kbd>.</p>
    </div>
  </section>

  <section class="overlay" id="levels" hidden>
    <div class="lvl-card">
      <h1>Мои уровни</h1>
      <div id="levelList"></div>
      <div class="row2">
        <button class="go2 green" id="btnNew" type="button">Новый уровень</button>
        <button class="go2 plain" id="btnLvBack" type="button">Назад</button>
      </div>
    </div>
  </section>

  <section class="overlay" id="over" hidden>
    <div class="card">
      <h1 id="ovTitle">Упал в сугроб</h1>
      <div class="badge" id="ovNew" hidden>Новый рекорд</div>
      <div class="stats">
        <div><span id="ovL1">Очки</span><b id="ovScore">0</b></div>
        <div><span id="ovL2">Рекорд</span><b id="ovBest">0</b></div>
        <div><span id="ovL3">Подарки</span><b id="ovGifts">0</b></div>
      </div>
      <button class="go" id="btnAgain" type="button">Ещё раз</button>
      <div class="row2">
        <button class="go2 plain" id="btnMenu" type="button">В меню</button>
        <button class="go2 green" id="btnBackEdit" type="button" hidden>В редактор</button>
      </div>
    </div>
  </section>

  <section class="editor" id="editor" hidden>
    <div class="ed-top">
      <button class="sm" id="edBack" type="button">Назад</button>
      <input id="edName" type="text" maxlength="24" value="Мой уровень" aria-label="Название уровня">
      <button class="sm play" id="edTest" type="button">Тест</button>
      <button class="sm" id="edSave" type="button">Сохранить</button>
    </div>
    <div class="ed-bottom">
      <div class="ed-tools" id="edTools">
        <button class="tool" type="button" data-tool="hand" aria-pressed="true">Рука</button>
        <button class="tool" type="button" data-tool="plat-ice" aria-pressed="false">Лёд</button>
        <button class="tool" type="button" data-tool="plat-snow" aria-pressed="false">Снег</button>
        <button class="tool" type="button" data-tool="plat-blink" aria-pressed="false">Мигает</button>
        <button class="tool" type="button" data-tool="plat-mover" aria-pressed="false">Лифт</button>
        <button class="tool" type="button" data-tool="spike" aria-pressed="false">Шипы</button>
        <button class="tool" type="button" data-tool="saw" aria-pressed="false">Пила</button>
        <button class="tool" type="button" data-tool="spring" aria-pressed="false">Пружина</button>
        <button class="tool" type="button" data-tool="ball" aria-pressed="false">Снежный ком</button>
        <button class="tool" type="button" data-tool="orb" aria-pressed="false">Шар</button>
        <button class="tool" type="button" data-tool="drip" aria-pressed="false">Сосулька</button>
        <button class="tool" type="button" data-tool="gift" aria-pressed="false">Подарок</button>
        <button class="tool" type="button" data-tool="finish" aria-pressed="false">Финиш</button>
        <button class="tool" type="button" data-tool="erase" aria-pressed="false">Ластик</button>
      </div>
      <div class="ed-nav">
        <button class="sm" id="edL" type="button">◀</button>
        <span id="edPos">Клетка 0</span>
        <button class="sm" id="edClear" type="button">Очистить</button>
        <button class="sm" id="edR" type="button">▶</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</main>

<script>
(() => {
'use strict';

const el = {};
document.querySelectorAll('[id]').forEach((n) => { el[n.id] = n; });
const stage = el.stage, cv = el.cv, ctx = cv.getContext('2d');
const bestWrap = document.querySelector('.best');

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const mod = (a, n) => ((a % n) + n) % n;
const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function icicle(x, y, L, w, fill, hi) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.quadraticCurveTo(x - w * 0.28, y + L * 0.62, x + 0.4, y + L);
  ctx.quadraticCurveTo(x + w * 0.3, y + L * 0.55, x + w / 2, y);
  ctx.closePath();
  ctx.fill();
  if (hi) {
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.22, y + 1);
    ctx.quadraticCurveTo(x - w * 0.15, y + L * 0.5, x, y + L * 0.85);
    ctx.stroke();
  }
}
function star(cx, cy, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
}


// ---------- constants ----------
const G = 2000, JUMP = 720, RUN = 235, HZ_L = 44, CELL = 24, START_COL = 8;
const BULBS = ['#ff4d5e', '#ffd166', '#6ee7ff', '#ff8fd8', '#8dff9e'];
const GIFT_BODY = ['#ff4d5e', '#2fb386', '#ffb703', '#7c6cff'];
const GIFT_RIB = ['#fff3c4', '#fff3c4', '#ff4d5e', '#ffd166'];
const DEATH = { fall: 'Упал в сугроб', ice: 'Сосулька попала', spike: 'Напоролся на шипы', saw: 'Пила-снежинка', ball: 'Снежный ком' };

// Endless presets: gap and width ranges, platform mix, trap odds per platform, roof icicle interval.
const DIFFS = {
  easy: { gap: [48, 78], w: [130, 185], ice: 0.45, crumb: 1.2, spike: 0.28, saw: 0, spring: 0, blink: 0, mover: 0, ball: 0, orb: 0, drip: 0.08, roof: [3.8, 2.6], gift: 0.4 },
  mid: { gap: [52, 88], w: [118, 170], ice: 0.6, crumb: 0.95, spike: 0.3, saw: 0, spring: 0.14, blink: 0.14, mover: 0.12, ball: 0, orb: 0, drip: 0.15, roof: [3.0, 1.8], gift: 0.35 },
  hard: { gap: [58, 100], w: [108, 155], ice: 0.7, crumb: 0.72, spike: 0.34, saw: 0.2, spring: 0.12, blink: 0.15, mover: 0.14, ball: 0.16, orb: 0.14, drip: 0.2, roof: [2.4, 1.3], gift: 0.3 },

// ---------- endless generator ----------

// ---------- level building ----------
function addObj(o, x, y) {

function stepPlay(dt) {
  const runHeld = runKey || runBtn;
  if (jumpCut) { if (P.vy < 0) P.vy *= 0.45; jumpCut = false; }

  const target = runHeld ? RUN : 0;
  const acc = P.on ? 1700 : 1000, dec = P.on ? 2400 : 260;

  if (P.on && P.stand && P.stand.kind === 'mover') P.y = P.stand.y;

  const prevY = P.y, wasOn = P.on;
  P.x += P.vx * dt;
  P.y += P.vy * dt;

  let landed = null;

  if (P.vy >= 0) {

      if (prevY <= p.y + 3 && P.y >= p.y && P.x + 8 > p.x && P.x - 8 < p.x + p.w) {
        if (!landed || p.y < landed.y) landed = p;

    P.y = landed.y; P.vy = 0; P.on = true; P.stand = landed;
    if (!wasOn && impact > 320) burst(P.x, P.y, 6, ['#ffffff', '#dfeaff'], 90, 0.6, 2.2);

    P.vy = -JUMP; P.on = false; P.coyote = 0; jumpBuf = 0;
    burst(P.x, P.y, 6, ['#ffffff', '#dfeaff'], 100, 0.2, 2.2);
  }

  checkItems();
  if (state !== 'play') return;

  maxX = Math.max(maxX, P.x);
  camX += (P.x - W * 0.28 - camX) * Math.min(1, dt * 9);

  if (src === 'endless') {

}

function update(dt) {
  time += dt;
  for (const f of flakes) {
    f.y += f.sp * dt;
    f.x += (Math.sin(time * 0.8 + f.ph) * 14 - 14) * dt;
    if (f.y > H + 4) { f.y = -4; f.x = rand(0, W); }
    if (f.x < -4) f.x = W + 4;
  }
  updateParts(dt);
  shake = Math.max(0, shake - dt * 30);
  if (state === 'play') {
    movePlats(); tickItems(dt);
    stepPlay(dt);
    updatePlats(dt);
    updateHazards(dt, true);
    updateBalls(dt, true);
  } else if (state === 'dead') {
    movePlats(); tickItems(dt);
    updatePlats(dt);

    updateBalls(dt, false);

      ctx.setLineDash([4, 7]);
      ctx.strokeStyle = 'rgba(255,125,135,' + (0.3 + 0.35 * Math.sin(h.t * 18)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, h.tip + 6); ctx.lineTo(x, yEnd); ctx.stroke();
      ctx.restore();
    }
    const g = ctx.createLinearGradient(0, h.tip - HZ_L, 0, h.tip);
    g.addColorStop(0, '#f2fbff'); g.addColorStop(1, '#69b9ec');
    icicle(x + wob, h.tip - HZ_L, HZ_L, 15, g, true);
  }
}

// ---------- editor grid ----------
function drawGrid() {
  ctx.save();
  ctx.lineWidth = 1;
  for (let r = -7; r <= 4; r++) {
    const y = Y0 + r * CELL;
    ctx.strokeStyle = r === 0 ? 'rgba(255,209,102,0.55)' : 'rgba(234,242,255,0.14)';
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  const c0 = Math.floor(camX / CELL);
  for (let c = c0; c <= c0 + Math.ceil(W / CELL) + 1; c++) {
    const x = c * CELL - camX;
    ctx.strokeStyle = c % 5 === 0 ? 'rgba(234,242,255,0.26)' : 'rgba(234,242,255,0.09)';
    ctx.beginPath(); ctx.moveTo(x, Y0 - 7 * CELL); ctx.lineTo(x, Y0 + 4 * CELL); ctx.stroke();
    if (c % 10 === 0 && c >= 0) {
      ctx.fillStyle = 'rgba(234,242,255,0.7)'; ctx.font = '700 10px Nunito, sans-serif';
      ctx.fillText(String(c), x + 3, Y0 - 7 * CELL - 4);
    }
  }
  const sx = START_COL * CELL - camX;
  ctx.fillStyle = 'rgba(255,77,94,0.12)';
  ctx.fillRect(-camX - 200, Y0 - 7 * CELL, 200 + START_COL * CELL, 11 * CELL);
  ctx.strokeStyle = 'rgba(255,77,94,0.85)'; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(sx, Y0 - 7 * CELL); ctx.lineTo(sx, Y0 + 4 * CELL); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ffb3bb'; ctx.font = '800 11px Nunito, sans-serif';
  ctx.fillText('СТАРТ', 8 - camX - 40 > -500 ? sx - 46 : 0, Y0 - 7 * CELL + 14);
  ctx.restore();
}

function render() {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 0.6, (Math.random() - 0.5) * shake * 0.6);
  drawScenery();
  drawEave();
  for (const p of plats) drawPlat(p);
  for (const it of items) drawItem(it);
  drawHazards();
  for (const b of balls) drawSnowball(b.x - camX, b.y - 13, b.rot);
  if (P && P.alive && (state === 'play' || state === 'dead')) drawPlayer();
  drawParts();
  if (state === 'edit') drawGrid();
  ctx.restore();
  drawFlakes();
}

// ---------- demo level ----------
function demoObjs() {
  const d = [
    ['plat-ice', 10, 0], ['gift', 12, 0],
    ['plat-snow', 17, -1], ['spike', 20, -1], ['gift', 21, -4],
    ['plat-ice', 27, -1], ['spring', 29, -1],
    ['plat-ice', 40, -3], ['saw', 42, -3], ['gift', 42, -7],
    ['plat-blink', 47, -2], ['plat-blink', 53, -2], ['plat-mover', 60, -2],
    ['plat-snow', 67, -1], ['drip', 70, -4], ['ball', 74, -1],
    ['plat-ice', 81, -1], ['orb', 89, -4],
    ['plat-snow', 94, -1], ['gift', 96, -2], ['finish', 100, -1]
  ];
  return d.map(([k, c, r]) => ({ k, c, r }));
}
const hasFinish = (lv) => lv.objs.some((o) => o.k === 'finish');

// ---------- toast and two-step buttons ----------
let toastT = 0;
function toast(m) {
  el.toast.textContent = m; el.toast.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.toast.hidden = true; }, 2000);
}
function armed(btn, label, fn) {
  if (btn.dataset.armed) { fn(); return; }
  const old = btn.textContent;
  btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('red');
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('red'); }, 2500);
}

// ---------- screens ----------
function setScreen(s) {
  state = s;
  el.menu.hidden = s !== 'menu';
  el.levels.hidden = s !== 'levels';
  el.editor.hidden = s !== 'edit';
  const pl = s === 'play' || s === 'dead';
  el.hud.hidden = !pl; el.controls.hidden = !pl;
  if (s !== 'dead') el.over.hidden = true;
  bestWrap.style.visibility = (s === 'menu' || (pl && src === 'endless')) ? 'visible' : 'hidden';
}
function goMenu() {
  src = 'endless'; testing = false;
  plats = []; items = []; balls = []; hazards = []; P = null; camX = 0;
  refreshBest(); setScreen('menu');
}
function startGame() { reset(); attempts++; setScreen('play'); }
function startEndless() { src = 'endless'; testing = false; playLv = null; attempts = 0; startGame(); }
function startLevel(lv, test) {
  if (!hasFinish(lv)) { toast('Поставь финиш, иначе уровень не пройти'); return; }
  src = 'level'; testing = test; playLv = lv; attempts = 0; startGame();
}
function showOver() {
  if (src === 'level') {
    el.ovL1.textContent = 'Путь'; el.ovScore.textContent = pct() + '%';
    el.ovL2.textContent = 'Попытка'; el.ovBest.textContent = attempts;
    el.ovL3.textContent = 'Подарки'; el.ovGifts.textContent = giftCount + '/' + giftTotal;
  } else {
    el.ovL1.textContent = 'Очки'; el.ovScore.textContent = total();
    el.ovL2.textContent = 'Рекорд'; el.ovBest.textContent = bests[diff] || 0;
    el.ovL3.textContent = 'Подарки'; el.ovGifts.textContent = giftCount;
  }
  el.ovTitle.textContent = won ? 'Уровень пройден!' : (DEATH[deathCause] || DEATH.fall);
  el.ovNew.hidden = !newRecord;
  el.btnBackEdit.hidden = !testing;
  el.over.hidden = false;
  try { el.btnAgain.focus({ preventScroll: true }); } catch (e) { /* focus unavailable */ }
}

// ---------- level list ----------
function openLevels() { renderLevels(); src = 'endless'; testing = false; setScreen('levels'); }
function renderLevels() {
  const list = el.levelList;
  list.textContent = '';
  const mk = (row, label, cls, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sm ' + cls; b.textContent = label;
    b.addEventListener('click', () => fn(b));
    row.appendChild(b);
    return b;
  };
  const demo = { id: 'demo', name: 'Первый снег', objs: demoObjs(), demo: true };
  [demo].concat(levels).forEach((lv) => {
    const row = document.createElement('div');
    row.className = 'lv';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = lv.name + (lv.demo ? ' · пример' : (hasFinish(lv) ? '' : ' · без финиша'));
    row.appendChild(nm);
    const pb = mk(row, 'Играть', 'play', () => startLevel(lv, false));
    if (!hasFinish(lv)) pb.disabled = true;
    if (lv.demo) {
      mk(row, 'Копия', '', () => {
        const cp = { id: 'l' + Date.now(), name: 'Первый снег (копия)', objs: demoObjs() };
        levels.push(cp); save(LS_L, levels); openEditor(cp);
      });
    } else {
      mk(row, 'Изм.', '', () => openEditor(lv));
      mk(row, 'Удалить', '', (b) => armed(b, 'Точно?', () => {
        levels = levels.filter((x) => x !== lv); save(LS_L, levels); renderLevels();
      }));
    }
    list.appendChild(row);
  });
  if (!levels.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'Своих уровней пока нет. Нажми «Новый уровень» или сделай копию примера.';
    list.appendChild(d);
  }
}

// ---------- editor ----------
const EDIT_ROWS = [-7, 4];
function newLevel() { openEditor({ id: 'l' + Date.now(), name: 'Мой уровень ' + (levels.length + 1), objs: [] }); }
function openEditor(lv) {
  editLv = lv; src = 'level'; testing = false;
  el.edName.value = lv.name;
  Y0 = refY(); camX = -90;
  setScreen('edit'); buildEdit(); setTool(tool);
}
function buildEdit() { buildLevel(editLv.objs); }
function setTool(t) {
  tool = t;
  el.edTools.querySelectorAll('.tool').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tool === t ? 'true' : 'false'));
}
function saveLevel(msg) {
  editLv.name = (el.edName.value.trim() || 'Без названия').slice(0, 24);
  if (!levels.includes(editLv)) {
    if (!editLv.objs.length) { if (msg) toast('Пока нечего сохранять'); return; }
    levels.push(editLv);
  }
  const ok = save(LS_L, levels);
  if (msg) toast(ok ? 'Сохранено' : 'Память браузера недоступна, уровень живёт до закрытия страницы');
}
function bbox(it) {
  switch (it.k) {
    case 'spike': return [it.x, it.y - 22, it.x + it.w, it.y + 4];
    case 'saw': return [it.x - 18, it.cy - 18, it.x + 18, it.cy + 18];
    case 'orb': return [it.x - 20, it.y - 20, it.x + 20, it.y + 20];
    case 'drip': return [it.x - 14, it.y - HZ_L - 10, it.x + 14, it.y + 4];
    case 'finish': return [it.x - 16, it.y - 74, it.x + 38, it.y + 6];
    default: return [it.x - 16, it.y - 32, it.x + 16, it.y + 4];
  }
}
function removeObj(o) {
  const i = editLv.objs.indexOf(o);
  if (i >= 0) { editLv.objs.splice(i, 1); buildEdit(); }
}
function editTap(px, py) {
  if (tool === 'hand') return;
  const wx = px / S + camX, vy = py / S;
  if (tool === 'erase') {
    for (let i = items.length - 1; i >= 0; i--) {
      const b = bbox(items[i]);
      if (wx >= b[0] && wx <= b[2] && vy >= b[1] && vy <= b[3]) { removeObj(items[i].ref); return; }
    }
    for (let i = plats.length - 1; i >= 0; i--) {
      const p = plats[i];
      if (p.ref && wx >= p.x && wx <= p.x + p.w && vy >= p.y - 14 && vy <= p.y + 40) { removeObj(p.ref); return; }
    }
    return;
  }
  let c = Math.floor(wx / CELL);
  const r = clamp(Math.round((vy - Y0) / CELL), EDIT_ROWS[0], EDIT_ROWS[1]);
  if (tool === 'plat-snow') c -= 4;
  else if (tool.startsWith('plat-')) c -= 2;
  else if (tool === 'spike') c -= 1;
  c = Math.max(START_COL, c);
  if (tool === 'finish') editLv.objs = editLv.objs.filter((o) => o.k !== 'finish');
  const i = editLv.objs.findIndex((o) => o.k === tool && o.c === c && o.r === r);
  if (i >= 0) editLv.objs.splice(i, 1);
  else if (editLv.objs.length >= 800) { toast('Слишком много объектов'); return; }
  else editLv.objs.push({ k: tool, c, r });
  buildEdit();
  burst(wx, vy, 6, ['#ffffff', '#9fd8ff'], 90, 0.3, 2);
}

// ---------- input ----------
function setJump(srcKey, v) {
  jumpSrc[srcKey] = v;
  if (v) jumpBuf = 0.12;
  else if (!anyJump()) jumpCut = true;
}
window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const c = e.code;
  const isRun = c === 'ArrowRight' || c === 'KeyD';
  const isJump = c === 'Space' || c === 'ArrowUp' || c === 'KeyW';
  if (state === 'edit') {
    if (c === 'ArrowRight') { camX = Math.min(camX + 96, 6000); e.preventDefault(); }
    else if (c === 'ArrowLeft') { camX = Math.max(camX - 96, -120); e.preventDefault(); }
    else if (c === 'Escape') { saveLevel(false); openLevels(); }
    return;
  }
  if (state === 'play' || state === 'dead') { if (isRun || isJump) e.preventDefault(); }
  if (e.repeat) return;
  if (isRun) runKey = true;
  else if (isJump) {
    if (state === 'play') setJump('key', true);
    else if (state === 'dead' && !el.over.hidden) startGame();
    else if (state === 'menu' && e.target === document.body) startEndless();
  } else if (c === 'Enter' && e.target === document.body) {
    if (state === 'dead' && !el.over.hidden) startGame();
    else if (state === 'menu') startEndless();
  } else if (c === 'Escape') {
    if (state === 'play' || state === 'dead') { if (testing) openEditor(editLv); else if (src === 'level') openLevels(); else goMenu(); }
    else if (state === 'levels') goMenu();
  }
});
window.addEventListener('keyup', (e) => {
  const c = e.code;
  if (c === 'ArrowRight' || c === 'KeyD') runKey = false;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') setJump('key', false);
});
window.addEventListener('blur', () => { runKey = false; runBtn = false; jumpSrc.key = false; jumpSrc.btn = false; jumpSrc.tap = false; });

function bindHold(node, onDown, onUp) {
  node.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { node.setPointerCapture(e.pointerId); } catch (err) { /* capture not supported */ }
    node.classList.add('on');
    onDown();
  });
  const up = () => { node.classList.remove('on'); onUp(); };
  node.addEventListener('pointerup', up);
  node.addEventListener('pointercancel', up);
}
bindHold(el.padRun, () => { runBtn = true; }, () => { runBtn = false; });
bindHold(el.padJump, () => setJump('btn', true), () => setJump('btn', false));

let drag = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state === 'play') { setJump('tap', true); return; }
  if (state === 'edit') {
    const r = cv.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, cam: camX, moved: false, px: e.clientX - r.left, py: e.clientY - r.top };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture not supported */ }
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8 || Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (drag.moved) camX = clamp(drag.cam - dx / S, -120, 6000);
});
const endPtr = (e) => {
  if (jumpSrc.tap) setJump('tap', false);
  if (drag) {
    if (!drag.moved && e.type === 'pointerup') editTap(drag.px, drag.py);
    drag = null;
  }
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
stage.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- buttons ----------
el.diffs.addEventListener('click', (e) => {
  const b = e.target.closest('.diff');
  if (!b) return;
  diff = b.dataset.diff;
  el.diffs.querySelectorAll('.diff').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  refreshBest();
});
el.btnStart.addEventListener('click', startEndless);
el.btnEdit.addEventListener('click', newLevel);
el.btnMine.addEventListener('click', openLevels);
el.btnLvBack.addEventListener('click', goMenu);
el.btnNew.addEventListener('click', newLevel);
el.btnAgain.addEventListener('click', startGame);
el.btnMenu.addEventListener('click', () => { if (src === 'level' && !testing) openLevels(); else goMenu(); });
el.btnBackEdit.addEventListener('click', () => openEditor(editLv));
el.edTools.addEventListener('click', (e) => {
  const b = e.target.closest('.tool');
  if (b) setTool(b.dataset.tool);
});
el.edBack.addEventListener('click', () => { saveLevel(false); openLevels(); });
el.edSave.addEventListener('click', () => saveLevel(true));
el.edTest.addEventListener('click', () => { saveLevel(false); startLevel(editLv, true); });
el.edL.addEventListener('click', () => { camX = Math.max(camX - 144, -120); });
el.edR.addEventListener('click', () => { camX = Math.min(camX + 144, 6000); });
el.edClear.addEventListener('click', () => armed(el.edClear, 'Точно?', () => {
  editLv.objs = []; buildEdit(); el.edClear.dispatchEvent(new Event('x'));
}));

// ---------- boot ----------
resize();
refreshBest();
setScreen('menu');
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
else window.addEventListener('resize', resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  if (state === 'edit') el.edPos.textContent = 'Клетка ' + Math.max(0, Math.floor((camX + W * 0.5) / CELL));
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
